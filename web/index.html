<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Между людьми</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #111111);
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
        }

        .header {
            text-align: center;
            margin-top: 30px;
        }

        .logo {
            width: 82px;
            height: 82px;

            margin: 0 auto 18px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .description {
            margin: 12px auto 0;
            max-width: 320px;

            font-size: 15px;
            line-height: 1.5;

            opacity: 0.65;
        }

        .menu {
            margin-top: 40px;

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 16px;

            padding: 17px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            background:
                var(--tg-theme-secondary-bg-color, #f1f1f1);

            color:
                var(--tg-theme-text-color, #111111);
        }

        button.primary {
            background:
                var(--tg-theme-button-color, #2481cc);

            color:
                var(--tg-theme-button-text-color, #ffffff);
        }

        .footer {
            margin-top: auto;
            padding-top: 30px;

            text-align: center;

            font-size: 12px;
            opacity: 0.45;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">
            💬
        </div>

        <h1>
            Между людьми
        </h1>

        <div class="description">
            Анонимное общение один-на-один.
            Найди собеседника и начни разговор.
        </div>

    </div>

    <div class="menu">

        <button
            class="primary"
            onclick="findPartner()"
        >
            🔎 Найти собеседника
        </button>

        <button onclick="profile()">
            👤 Мой профиль
        </button>

        <button onclick="settings()">
            ⚙️ Настройки
        </button>

        <button onclick="rules()">
            📋 Правила
        </button>

        <button onclick="about()">
            ℹ️ О приложении
        </button>

    </div>

    <div class="footer">
        «Между людьми» • анонимное общение
    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    function findPartner() {
        tg.showAlert(
            "🔎 Поиск собеседника будет доступен в следующей версии."
        );
    }

    function profile() {
        tg.showAlert(
            "👤 Профиль пока находится в разработке."
        );
    }

    function settings() {
        tg.showAlert(
            "⚙️ Настройки пока находятся в разработке."
        );
    }

    function rules() {
        tg.showAlert(
            "📋 Правила:\n\n" +
            "1. Уважай собеседника.\n" +
            "2. Не публикуй личные данные.\n" +
            "3. Не угрожай другим пользователям.\n" +
            "4. Не отправляй запрещённый контент.\n\n" +
            "Возраст: 14+."
        );
    }

    function about() {
        tg.showAlert(
            "ℹ️ «Между людьми» — анонимное приложение " +
            "для общения один-на-один."
        );
    }

</script>

</body>
</html>
